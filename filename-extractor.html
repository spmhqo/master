<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Folder File Name Extractor</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --success: #16a34a;
      --danger: #dc2626;
      --radius: 10px;
      --shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px 16px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--success);
      background: #dcfce7;
      padding: 5px 12px;
      border-radius: 999px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 20px;
    }

    /* Dropzone */
    .dropzone {
      border: 2px dashed #cbd5e1;
      border-radius: var(--radius);
      background: var(--surface-alt);
      padding: 36px 20px;
      text-align: center;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .dropzone:hover,
    .dropzone.dragover {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .dropzone-icon {
      font-size: 2.2rem;
      margin-bottom: 8px;
      display: block;
    }

    .dropzone h2 {
      font-size: 1.1rem;
      margin-bottom: 6px;
    }

    .dropzone p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 16px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      font-family: inherit;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-outline {
      background: var(--surface);
      border-color: var(--border);
      color: var(--text);
    }

    .btn-outline:hover:not(:disabled) {
      background: var(--surface-alt);
      border-color: #cbd5e1;
    }

    .btn-danger-outline {
      background: var(--surface);
      border-color: var(--border);
      color: var(--danger);
    }

    .btn-danger-outline:hover:not(:disabled) {
      background: #fef2f2;
      border-color: #fecaca;
    }

    /* Controls */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      margin-bottom: 16px;
    }

    @media (max-width: 640px) {
      .controls-grid {
        grid-template-columns: 1fr;
      }
    }

    .input-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input[type="text"],
    select {
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      font-family: inherit;
      background: var(--surface);
      color: var(--text);
    }

    input[type="text"] {
      flex: 1;
      min-width: 200px;
    }

    input[type="text"]:focus,
    select:focus {
      outline: 2px solid var(--primary-soft);
      border-color: var(--primary);
    }

    .toggles {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .toggle-label {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 0.875rem;
      color: var(--text);
      cursor: pointer;
      user-select: none;
    }

    .toggle-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    /* Toolbar & Stats */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .stats {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .stats strong {
      color: var(--text);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Table */
    .table-wrapper {
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: auto;
      max-height: 460px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.875rem;
    }

    thead th {
      position: sticky;
      top: 0;
      background: var(--surface-alt);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      font-weight: 600;
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      z-index: 1;
    }

    tbody td {
      padding: 9px 14px;
      border-bottom: 1px solid var(--border);
      word-break: break-word;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr:hover {
      background: var(--surface-alt);
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.84rem;
    }

    .ext-pill {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 5px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
      font-size: 0.92rem;
    }

    .limit-banner {
      background: #fefce8;
      border: 1px solid #fef08a;
      color: #854d0e;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.84rem;
      margin-bottom: 12px;
      display: none;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0f172a;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.2s ease;
      pointer-events: none;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    #folderInput {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Folder File Name Extractor</h1>
      <span class="badge">100% Offline &amp; Local — No Upload</span>
    </header>

    <!-- Upload / Drop Card -->
    <div class="card">
      <div class="dropzone" id="dropzone">
        <span class="dropzone-icon">📂</span>
        <h2>Drop a folder from your Desktop here</h2>
        <p>Or click the button below to browse and select any folder</p>
        <button type="button" class="btn btn-primary" id="browseBtn">Select Folder</button>
        <input type="file" id="folderInput" webkitdirectory directory multiple />
      </div>
    </div>

    <!-- Filter & Export Card -->
    <div class="card">
      <div class="controls-grid">
        <div class="input-group">
          <input type="text" id="searchInput" placeholder="Filter by file name, path, or extension (e.g. .pdf)..." disabled />
        </div>
        <div>
          <select id="sortSelect" disabled>
            <option value="name-asc">Sort: Name (A → Z)</option>
            <option value="name-desc">Sort: Name (Z → A)</option>
            <option value="ext-asc">Sort: Extension</option>
            <option value="size-desc">Sort: Size (Largest)</option>
            <option value="size-asc">Sort: Size (Smallest)</option>
          </select>
        </div>
      </div>

      <div class="toggles">
        <label class="toggle-label">
          <input type="checkbox" id="optSubfolders" checked />
          Include subfolders
        </label>
        <label class="toggle-label">
          <input type="checkbox" id="optHideHidden" checked />
          Ignore hidden/system files (e.g. .DS_Store)
        </label>
        <label class="toggle-label">
          <input type="checkbox" id="optIncludeExt" checked />
          Include file extensions
        </label>
        <label class="toggle-label">
          <input type="checkbox" id="optRelativePath" />
          Use subfolder path in output
        </label>
      </div>
    </div>

    <!-- Results Card -->
    <div class="card">
      <div class="toolbar">
        <div class="stats" id="statsText">No folder selected yet.</div>
        <div class="actions">
          <button type="button" class="btn btn-primary" id="copyBtn" disabled>Copy File Names</button>
          <button type="button" class="btn btn-outline" id="downloadTxtBtn" disabled>Download .TXT</button>
          <button type="button" class="btn btn-outline" id="downloadCsvBtn" disabled>Download .CSV</button>
          <button type="button" class="btn btn-danger-outline" id="clearBtn" disabled>Clear</button>
        </div>
      </div>

      <div class="limit-banner" id="limitBanner"></div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th style="width: 55px;">#</th>
              <th>Extracted Name</th>
              <th>Subfolder</th>
              <th style="width: 90px;">Ext</th>
              <th style="width: 100px;">Size</th>
            </tr>
          </thead>
          <tbody id="fileTableBody">
            <tr>
              <td colspan="5" class="empty-state">
                Select or drop a folder above to extract its file names.
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    (function () {
      const PREVIEW_LIMIT = 2000;

      // DOM Elements
      const dropzone = document.getElementById("dropzone");
      const browseBtn = document.getElementById("browseBtn");
      const folderInput = document.getElementById("folderInput");
      const searchInput = document.getElementById("searchInput");
      const sortSelect = document.getElementById("sortSelect");

      const optSubfolders = document.getElementById("optSubfolders");
      const optHideHidden = document.getElementById("optHideHidden");
      const optIncludeExt = document.getElementById("optIncludeExt");
      const optRelativePath = document.getElementById("optRelativePath");

      const statsText = document.getElementById("statsText");
      const limitBanner = document.getElementById("limitBanner");
      const fileTableBody = document.getElementById("fileTableBody");

      const copyBtn = document.getElementById("copyBtn");
      const downloadTxtBtn = document.getElementById("downloadTxtBtn");
      const downloadCsvBtn = document.getElementById("downloadCsvBtn");
      const clearBtn = document.getElementById("clearBtn");
      const toast = document.getElementById("toast");

      // State
      let allFiles = [];
      let rootFolderName = "";
      let toastTimer = null;

      // Utility: Show Toast
      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.remove("show");
        }, 2500);
      }

      // Utility: Format Bytes
      function formatBytes(bytes) {
        if (bytes === 0) return "0 B";
        const k = 1024;
        const sizes = ["B", "KB", "MB", "GB", "TB"];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + " " + sizes[i];
      }

      // Utility: Parse file metadata
      function normalizeFile(file, relPath) {
        const cleanPath = relPath.replace(/^\/+/, "");
        const parts = cleanPath.split("/");
        const fileName = file.name;

        // Extension handling (ignore leading dot for dotfiles like .gitignore)
        const dotIndex = fileName.lastIndexOf(".");
        const hasExt = dotIndex > 0;
        const ext = hasExt ? fileName.slice(dotIndex + 1).toLowerCase() : "";
        const baseName = hasExt ? fileName.slice(0, dotIndex) : fileName;

        // Depth 0 = directly inside selected folder
        const depth = Math.max(0, parts.length - 2);
        const subfolder = parts.length > 2 ? parts.slice(1, -1).join("/") : "";

        return {
          name: fileName,
          baseName: baseName,
          ext: ext,
          relativePath: cleanPath,
          subfolder: subfolder,
          depth: depth,
          size: file.size,
          lastModified: file.lastModified
        };
      }

      // Format output name based on user toggles
      function getFormattedName(item) {
        const filePart = optIncludeExt.checked ? item.name : item.baseName;
        if (optRelativePath.checked && item.subfolder) {
          return item.subfolder + "/" + filePart;
        }
        return filePart;
      }

      // Read all entries from a DirectoryReader (Chrome returns max 100 per readEntries call)
      async function readAllDirectoryEntries(dirReader) {
        const entries = [];
        let batch;
        do {
          batch = await new Promise((resolve, reject) => {
            dirReader.readEntries(resolve, reject);
          });
          entries.push(...batch);
        } while (batch.length > 0);
        return entries;
      }

      // Recursively traverse dropped entries
      async function traverseEntry(entry, collected) {
        if (entry.isFile) {
          const file = await new Promise((resolve, reject) => {
            entry.file(resolve, reject);
          });
          collected.push(normalizeFile(file, entry.fullPath));
        } else if (entry.isDirectory) {
          const dirReader = entry.createReader();
          const entries = await readAllDirectoryEntries(dirReader);
          for (const child of entries) {
            await traverseEntry(child, collected);
          }
        }
      }

      // Load files from <input webkitdirectory>
      function handleInputFiles(fileList) {
        if (!fileList || fileList.length === 0) return;
        const parsed = [];
        for (const file of fileList) {
          const rel = file.webkitRelativePath || file.name;
          parsed.push(normalizeFile(file, rel));
        }
        const firstPath = parsed[0].relativePath;
        rootFolderName = firstPath.includes("/") ? firstPath.split("/")[0] : "Selected Files";
        allFiles = parsed;
        render();
        showToast(`Extracted ${allFiles.length.toLocaleString()} file(s)`);
      }

      // Filter and sort current list
      function getFilteredFiles() {
        const query = searchInput.value.trim().toLowerCase();
        const includeSubfolders = optSubfolders.checked;
        const hideHidden = optHideHidden.checked;
        const sortBy = sortSelect.value;

        const filtered = allFiles.filter((item) => {
          if (!includeSubfolders && item.depth > 0) return false;

          if (hideHidden) {
            const segments = item.relativePath.split("/");
            const isHidden = segments.some(
              (seg, idx) => idx > 0 && (seg.startsWith(".") || seg === "Thumbs.db" || seg === "desktop.ini")
            );
            if (isHidden) return false;
          }

          if (query) {
            const haystack = `${item.name} ${item.subfolder} .${item.ext}`.toLowerCase();
            if (!haystack.includes(query)) return false;
          }

          return true;
        });

        filtered.sort((a, b) => {
          switch (sortBy) {
            case "name-asc":
              return getFormattedName(a).localeCompare(getFormattedName(b), undefined, { numeric: true, sensitivity: "base" });
            case "name-desc":
              return getFormattedName(b).localeCompare(getFormattedName(a), undefined, { numeric: true, sensitivity: "base" });
            case "ext-asc":
              return a.ext.localeCompare(b.ext) || a.name.localeCompare(b.name);
            case "size-desc":
              return b.size - a.size;
            case "size-asc":
              return a.size - b.size;
            default:
              return 0;
          }
        });

        return filtered;
      }

      // Render UI
      function render() {
        const hasAnyFiles = allFiles.length > 0;
        searchInput.disabled = !hasAnyFiles;
        sortSelect.disabled = !hasAnyFiles;
        clearBtn.disabled = !hasAnyFiles;

        if (!hasAnyFiles) {
          statsText.textContent = "No folder selected yet.";
          limitBanner.style.display = "none";
          copyBtn.disabled = true;
          downloadTxtBtn.disabled = true;
          downloadCsvBtn.disabled = true;
          fileTableBody.innerHTML = `
            <tr>
              <td colspan="5" class="empty-state">
                Select or drop a folder above to extract its file names.
              </td>
            </tr>`;
          return;
        }

        const filtered = getFilteredFiles();
        const totalSize = filtered.reduce((sum, f) => sum + f.size, 0);

        statsText.innerHTML = `Folder: <strong>${escapeHtml(rootFolderName)}</strong> &bull; Showing <strong>${filtered.length.toLocaleString()}</strong> of ${allFiles.length.toLocaleString()} files &bull; Total size: <strong>${formatBytes(totalSize)}</strong>`;

        const hasResults = filtered.length > 0;
        copyBtn.disabled = !hasResults;
        downloadTxtBtn.disabled = !hasResults;
        downloadCsvBtn.disabled = !hasResults;

        if (!hasResults) {
          limitBanner.style.display = "none";
          fileTableBody.innerHTML = `
            <tr>
              <td colspan="5" class="empty-state">
                No files match your current filters.
              </td>
            </tr>`;
          return;
        }

        if (filtered.length > PREVIEW_LIMIT) {
          limitBanner.style.display = "block";
          limitBanner.textContent = `Showing the first ${PREVIEW_LIMIT.toLocaleString()} files in the preview table to keep the browser fast. Copy and Download will still include all ${filtered.length.toLocaleString()} files.`;
        } else {
          limitBanner.style.display = "none";
        }

        const fragment = document.createDocumentFragment();
        const renderCount = Math.min(filtered.length, PREVIEW_LIMIT);

        for (let i = 0; i < renderCount; i++) {
          const item = filtered[i];
          const tr = document.createElement("tr");

          const tdIndex = document.createElement("td");
          tdIndex.textContent = i + 1;
          tdIndex.style.color = "var(--text-muted)";

          const tdName = document.createElement("td");
          tdName.className = "mono";
          tdName.textContent = getFormattedName(item);

          const tdSub = document.createElement("td");
          tdSub.className = "mono";
          tdSub.style.color = "var(--text-muted)";
          tdSub.textContent = item.subfolder || "—";

          const tdExt = document.createElement("td");
          if (item.ext) {
            const pill = document.createElement("span");
            pill.className = "ext-pill";
            pill.textContent = "." + item.ext;
            tdExt.appendChild(pill);
          } else {
            tdExt.textContent = "—";
          }

          const tdSize = document.createElement("td");
          tdSize.textContent = formatBytes(item.size);
          tdSize.style.color = "var(--text-muted)";

          tr.append(tdIndex, tdName, tdSub, tdExt, tdSize);
          fragment.appendChild(tr);
        }

        fileTableBody.innerHTML = "";
        fileTableBody.appendChild(fragment);
      }

      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      // Copy to Clipboard
      async function copyFileNames() {
        const filtered = getFilteredFiles();
        const text = filtered.map(getFormattedName).join("\n");

        try {
          await navigator.clipboard.writeText(text);
          showToast(`Copied ${filtered.length.toLocaleString()} file name(s) to clipboard!`);
        } catch {
          // Fallback for restricted local file:// contexts
          const textarea = document.createElement("textarea");
          textarea.value = text;
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand("copy");
          document.body.removeChild(textarea);
          showToast(`Copied ${filtered.length.toLocaleString()} file name(s) to clipboard!`);
        }
      }

      // Download Helper
      function downloadFile(content, filename, mimeType) {
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      function downloadTxt() {
        const filtered = getFilteredFiles();
        const content = filtered.map(getFormattedName).join("\n");
        const safeName = (rootFolderName || "folder").replace(/[^a-z0-9_-]/gi, "_");
        downloadFile(content, `${safeName}_filenames.txt`, "text/plain;charset=utf-8");
        showToast("Downloaded .TXT file");
      }

      function csvCell(val) {
        const str = String(val ?? "");
        return `"${str.replace(/"/g, '""')}"`;
      }

      function downloadCsv() {
        const filtered = getFilteredFiles();
        const header = ["Extracted Name", "Original Name", "Subfolder", "Extension", "Size (Bytes)", "Last Modified"];
        const rows = filtered.map((item) => [
          csvCell(getFormattedName(item)),
          csvCell(item.name),
          csvCell(item.subfolder),
          csvCell(item.ext),
          csvCell(item.size),
          csvCell(new Date(item.lastModified).toISOString())
        ].join(","));

        const content = "\uFEFF" + [header.join(","), ...rows].join("\n");
        const safeName = (rootFolderName || "folder").replace(/[^a-z0-9_-]/gi, "_");
        downloadFile(content, `${safeName}_files.csv`, "text/csv;charset=utf-8");
        showToast("Downloaded .CSV file");
      }

      // Event Listeners
      browseBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        folderInput.click();
      });

      dropzone.addEventListener("click", () => {
        folderInput.click();
      });

      folderInput.addEventListener("change", (e) => {
        handleInputFiles(e.target.files);
        folderInput.value = "";
      });

      // Drag and Drop Events
      ["dragenter", "dragover"].forEach((evt) => {
        dropzone.addEventListener(evt, (e) => {
          e.preventDefault();
          e.stopPropagation();
          dropzone.classList.add("dragover");
        });
      });

      ["dragleave", "drop"].forEach((evt) => {
        dropzone.addEventListener(evt, (e) => {
          e.preventDefault();
          e.stopPropagation();
          dropzone.classList.remove("dragover");
        });
      });

      dropzone.addEventListener("drop", async (e) => {
        const items = e.dataTransfer?.items;
        if (!items || items.length === 0) return;

        // Capture entries synchronously before yielding to async traversal
        const entries = [];
        for (const item of items) {
          if (typeof item.webkitGetAsEntry === "function") {
            const entry = item.webkitGetAsEntry();
            if (entry) entries.push(entry);
          }
        }

        if (entries.length === 0) {
          handleInputFiles(e.dataTransfer.files);
          return;
        }

        statsText.textContent = "Scanning folder...";
        const collected = [];
        for (const entry of entries) {
          await traverseEntry(entry, collected);
        }

        rootFolderName = entries.length === 1 ? entries[0].name : `${entries.length} Dropped Items`;
        allFiles = collected;
        render();
        showToast(`Extracted ${allFiles.length.toLocaleString()} file(s)`);
      });

      // Controls
      searchInput.addEventListener("input", render);
      sortSelect.addEventListener("change", render);
      optSubfolders.addEventListener("change", render);
      optHideHidden.addEventListener("change", render);
      optIncludeExt.addEventListener("change", render);
      optRelativePath.addEventListener("change", render);

      copyBtn.addEventListener("click", copyFileNames);
      downloadTxtBtn.addEventListener("click", downloadTxt);
      downloadCsvBtn.addEventListener("click", downloadCsv);

      clearBtn.addEventListener("click", () => {
        allFiles = [];
        rootFolderName = "";
        searchInput.value = "";
        render();
      });
    })();
  </script>
</body>
</html>
