<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blog Post Assets</title>
  <link rel="icon" href="spm.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient-start: #020617;
      --bg-gradient-end: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.4);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-primary: #22d3ee;
      --accent-hover: #67e8f9;
      --accent-success: #10b981;
      --accent-danger: #f43f5e;
      --code-bg: rgba(0, 0, 0, 0.3);
      --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: fixed linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-primary);
      line-height: 1.6;
      padding: 60px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 50px;
    }

    h1 {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .sub-header {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--accent-primary);
      letter-spacing: 0.02em;
    }

    .prompt-workflow {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .step-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 35px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .step-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .step-label {
      font-weight: 800;
      font-size: 0.8rem;
      background: var(--accent-primary);
      color: #020617;
      padding: 5px 16px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .clear-btn {
      background: transparent;
      border: 1px solid var(--accent-danger);
      color: var(--accent-danger);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
    }

    .clear-btn:hover {
      background: var(--accent-danger);
      color: white;
    }

    label {
      display: block;
      color: var(--accent-primary);
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 12px;
      letter-spacing: 0.03em;
    }

    .dynamic-input {
      width: 100%;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      padding: 16px;
      border-radius: 12px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      line-height: 1.5;
      outline: none;
      resize: vertical;
      min-height: 110px;
      transition: border-color 0.3s;
    }

    .dynamic-input:focus {
      border-color: var(--accent-primary);
    }

    .prompt-content {
      background: var(--code-bg);
      padding: 25px;
      border-radius: 12px;
      font-family: 'Source Code Pro', monospace;
      font-size: 0.92rem;
      color: #cbd5e1;
      white-space: pre-wrap;
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 22px;
      line-height: 1.6;
      word-break: break-word;
      max-height: 520px;
      overflow-y: auto;
    }

    .prompt-content::-webkit-scrollbar { width: 8px; }
    .prompt-content::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    .prompt-content::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 4px; }

    #promptsContainer {
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .btn {
      padding: 14px 32px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      width: 100%;
      text-decoration: none;
      border: none;
    }

    .copy-btn {
      background: rgba(34, 211, 238, 0.1);
      color: var(--accent-primary);
      border: 1px solid var(--accent-primary);
    }

    .copy-btn:hover {
      background: var(--accent-primary);
      color: #020617;
    }

    .copy-btn.copied {
      background: var(--accent-success);
      border-color: var(--accent-success);
      color: white;
    }

    .footer {
      margin-top: 80px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
      padding-top: 40px;
      width: 100%;
      padding-bottom: 40px;
    }

    @media (max-width: 600px) {
      h1 { font-size: 2rem; }
      .sub-header { font-size: 1rem; }
      .step-card { padding: 22px; }
      .prompt-content { font-size: 0.85rem; }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Blog Post Assets</h1>
      <p class="sub-header">(for community contents)</p>
    </header>

    <div class="prompt-workflow">
      
      <!-- Multiline Input Card 1 -->
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Input Data 1</span>
          <button class="clear-btn" onclick="resetInput('inputTitle')">Reset</button>
        </div>
        <label for="inputTitle">[এখানে বাংলা Blog Title দিন]</label>
        <textarea id="inputTitle" class="dynamic-input" placeholder="এখানে বাংলা Blog Title লিখুন বা পেস্ট করুন..." oninput="updatePrompts()"></textarea>
      </div>

      <!-- Multiline Input Card 2 -->
      <div class="step-card">
        <div class="step-header">
          <span class="step-label">Input Data 2</span>
          <button class="clear-btn" onclick="resetInput('inputBlogPost')">Reset</button>
        </div>
        <label for="inputBlogPost">[Insert Your Blog Post Here]</label>
        <textarea id="inputBlogPost" class="dynamic-input" placeholder="Type or paste your blog post here..." oninput="updatePrompts()"></textarea>
      </div>

      <!-- Prompt Result Cards -->
      <div id="promptsContainer">
        <!-- Prompts injected by JavaScript -->
      </div>

    </div>

    <footer class="footer">
      <p>Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.</p>
    </footer>
  </div>

  <script>
    const templates = [
      {
        id: 1,
        text: `অনুগ্রহ করে আগের Content-এর জন্য একটা 16:9 landscape feature image (strictly tailored to blog post) তৈরি করে দাও।`
      },
      {
        id: 2,
        text: `TASK: Convert the Provided Blog Post into Blogger-Compatible, Copy-Paste-Ready HTML.

আমি আপনাকে একটি সম্পূর্ণ ব্লগ পোস্ট দেব। আপনার কাজ হলো, মূল কনটেন্টের কোনও পরিবর্তন না করে সেটিকে Blogger-এর জন্য একটি Properly Formatted HTML Layout-এ রূপান্তর করা।

OBJECTIVE

আমি চাই, আপনার তৈরি HTML Code Blogger-এর Post Editor-এর HTML View-তে সরাসরি পেস্ট করতে পারি। এরপর Compose View-তে গেলে সমস্ত Formatting যথাযথভাবে দৃশ্যমান হবে।

MANDATORY RULES

1. CONTENT PRESERVATION

মূল কনটেন্ট যতটা সম্ভব হুবহু অপরিবর্তিত রাখবেন।

কোনও বাক্য, শব্দ, তথ্য, বক্তব্য বা উদাহরণ Rewrite, Modify, Add অথবা Delete করবেন না।

শুধুমাত্র Formatting এবং Layout পরিবর্তন করতে পারবেন।

2. PROPER HTML FORMATTING

প্রয়োজন অনুযায়ী নিচের HTML Elements ব্যবহার করুন:

- Blog Post Title: H1 ব্যবহার করবেন না। Blogger-এর Post Title আলাদাভাবে পরিচালিত হয়।
- Main Section Headings: H2
- Subheadings: H3
- Paragraphs: P
- Bold Text: STRONG
- Italic Text: EM
- Bullet Lists: UL এবং LI
- Numbered Lists: OL এবং LI
- Blockquotes: BLOCKQUOTE
- Hyperlinks: A

মূল কনটেন্টের Structure এবং Emphasis অনুযায়ী Formatting নির্ধারণ করবেন।

3. BLOGGER COMPATIBILITY

- Blogger-supported, clean HTML ব্যবহার করবেন।
- HTML Fragment তৈরি করবেন, সম্পূর্ণ HTML Document নয়।
- HTML, HEAD এবং BODY Tags ব্যবহার করবেন না।
- অপ্রয়োজনীয় CSS, JavaScript, Inline Styling বা Custom Classes ব্যবহার করবেন না।
- অপ্রয়োজনীয় DIV এবং SPAN Elements ব্যবহার করবেন না।
- HTML Formatting-এর পরিবর্তে Markdown Syntax ব্যবহার করবেন না।
- কোনও Heading-কে শুধু Bold Paragraph হিসেবে তৈরি করবেন না। যথাযথ Heading Tags ব্যবহার করবেন।

4. FORMATTING INTEGRITY

- প্রতিটি Heading, Subheading এবং Paragraph আলাদা HTML Element-এর মধ্যে রাখবেন।
- Lists-এর প্রতিটি Item সঠিকভাবে Format করবেন।
- Paragraph-এর মধ্যে অপ্রয়োজনীয় Line Break ব্যবহার করবেন না।
- মূল লেখার Bold এবং Italic Emphasis বজায় রাখবেন।

5. OUTPUT REQUIREMENTS

- সম্পূর্ণ HTML Code একটি মাত্র Code Block-এর মধ্যে দিন।
- HTML Code ছাড়া অন্য কোনও ব্যাখ্যা বা মন্তব্য দেবেন না।
- কনটেন্টের কোনও অংশ বাদ দেবেন না।
- HTML Code যেন Blogger-এর HTML View-তে সরাসরি পেস্ট করার উপযোগী হয়।

BLOG POST:

[Insert Your Blog Post Here]`
      },
      {
        id: 3,
        text: `আপনি একজন SEO-friendly URL Slug Generator হিসেবে কাজ করবেন।

আমি আপনাকে একটি বাংলা ব্লগ পোস্টের Title দেব। আপনার কাজ হলো সেই বাংলা Title থেকে একটি পরিষ্কার, সংক্ষিপ্ত, readable এবং SEO-friendly URL slug তৈরি করা।

মূল নিয়ম

1. বাংলা শব্দগুলিকে English/Roman letters-এ **transliterate** করবেন।
2. বাংলা শব্দের অর্থ English-এ **translate করবেন না**।
3. বাংলা উচ্চারণ যতটা সম্ভব স্বাভাবিকভাবে Roman letters-এ প্রকাশ করবেন।
4. প্রতিটি শব্দ lowercase-এ লিখবেন।
5. শব্দগুলোর মধ্যে শুধুমাত্র hyphen \`-\` ব্যবহার করবেন।
6. কোনো space, underscore \`_\`, slash \`/\`, punctuation বা special character ব্যবহার করবেন না।
7. অপ্রয়োজনীয় শব্দ বাদ দেবেন না, যদি না সেগুলি URL-কে অস্বাভাবিকভাবে দীর্ঘ করে।
8. URL slug যেন Title-এর মূল অর্থ ও বিষয় স্পষ্টভাবে বোঝায়।
9. Transliteration হবে Bengali pronunciation অনুযায়ী, English translation অনুযায়ী নয়।
10. URL slug-এর শুরু বা শেষে hyphen থাকবে না।
11. একই শব্দের transliteration-এ consistency বজায় রাখবেন।
12. URL slug যতটা সম্ভব ছোট, পরিষ্কার এবং human-readable রাখবেন।
13. শুধুমাত্র final URL slug output করবেন। কোনো explanation, quotation mark বা অতিরিক্ত text দেবেন না।

উদাহরণ:

Title:
অঙ্ক বুঝতে এত সমস্যা হয় কেন?

Output:
onk-bujhte-eto-somossha-hoy-keno

Title:
ভগ্নাংশ আসলে কী এবং কীভাবে বুঝবেন?

Output:
vognangsho-asole-ki-ebong-kivabe-bujhben

Title:
ছাত্ররা অঙ্কে বারবার একই ভুল করে কেন?

Output:
chatrara-onke-barbar-ekoi-bhul-kore-keno

এখন নিচের বাংলা Blog Title-এর জন্য URL slug তৈরি করুন:

[এখানে বাংলা Blog Title দিন]`
      }
    ];

    function createCards() {
      const container = document.getElementById('promptsContainer');
      container.innerHTML = '';
      templates.forEach(t => {
        const card = document.createElement('div');
        card.className = 'step-card';
        card.innerHTML = `
          <div class="step-header">
            <span class="step-label">Prompt #${t.id}</span>
          </div>
          <div class="prompt-content" id="p${t.id}"></div>
          <button class="btn copy-btn" onclick="copyText('p${t.id}', this)">
            <span>Copy Prompt #${t.id}</span>
          </button>
        `;
        container.appendChild(card);
      });
    }

    function updatePrompts() {
      const titleVal = document.getElementById('inputTitle').value.trim() || "[এখানে বাংলা Blog Title দিন]";
      const blogPostVal = document.getElementById('inputBlogPost').value.trim() || "[Insert Your Blog Post Here]";

      templates.forEach(t => {
        let updatedText = t.text;
        if (t.id === 2) {
          updatedText = updatedText.split('[Insert Your Blog Post Here]').join(blogPostVal);
        }
        if (t.id === 3) {
          updatedText = updatedText.split('[এখানে বাংলা Blog Title দিন]').join(titleVal);
        }
        document.getElementById(`p${t.id}`).textContent = updatedText;
      });
    }

    function resetInput(fieldId) {
      document.getElementById(fieldId).value = "";
      updatePrompts();
    }

    function copyText(id, btn) {
      const text = document.getElementById(id).textContent;
      navigator.clipboard.writeText(text).then(() => {
        const originalText = btn.innerHTML;
        btn.innerHTML = `<span>Copied to Clipboard!</span>`;
        btn.classList.add('copied');
        
        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    // Initialize on page load
    window.onload = () => {
      createCards();
      updatePrompts();
    };
  </script>
</body>
</html>
